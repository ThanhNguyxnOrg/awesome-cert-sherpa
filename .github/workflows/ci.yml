name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-node.yml@487331d8d32ef5847ac1e53935681669cf56e331
    with:
      job_name: Build & Validate
      node_version: "20"
      package_manager: pnpm
      package_manager_version: "10.28.0"
      cache: pnpm
      validation_command: pnpm validate
      build_command: pnpm build
